<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Seller dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
.adm{display:flex;flex-direction:column;gap:18px;padding-bottom:60px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.cols .wide{grid-column:1/-1}
.olist,.ilist{display:flex;flex-direction:column;gap:10px}
.ocard{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:14px;background:var(--surface)}
.ocard h3{margin:0;font-size:16px}
.ocard ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.oacts{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:150px}
.irow{display:grid;grid-template-columns:20px 56px minmax(0,1fr) auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.irow .rowsel{width:18px;height:18px;margin:6px 0 0;accent-color:var(--accent);cursor:pointer}
.irow.sel{border-color:var(--accent);background:var(--accent-soft)}
.ibulk{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.selall{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;align-self:flex-start}
.selall input{width:18px;height:18px;accent-color:var(--accent)}
.bulkbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-soft);position:sticky;top:8px;z-index:5}
.bulkbar .bk{display:inline-flex;gap:4px}
.bulkbar input,.bulkbar select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font-size:13px;width:110px}
.irow .thumbbtn{width:56px;aspect-ratio:63/88;border:1px dashed var(--line);border-radius:5px;background:var(--sunken);overflow:hidden;padding:0;cursor:pointer;font-size:10px;color:var(--muted)}
.irow .thumbbtn img{width:100%;height:100%;object-fit:cover;display:block}
.ifields{display:grid;grid-template-columns:2fr 1.4fr .7fr 1.1fr .9fr .8fr .6fr 1fr 1fr;gap:8px}
.ifields .field input,.ifields .field select{padding:6px 8px;font-size:13.5px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.thumbcol{display:flex;flex-direction:column;gap:4px;width:56px}
.thumbcol .tiny{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:5px;font-size:11px;font-weight:600;padding:3px 0;cursor:pointer;width:100%}
.thumbcol .tiny:hover{border-color:var(--accent);color:var(--accent)}
.thumbcol .tiny:disabled{opacity:.6;cursor:default}
.thumbcol .tiny[aria-disabled="true"]{opacity:.45}
.autoread{display:flex;align-items:flex-start;gap:8px;font-size:14px;font-weight:600;cursor:pointer}
.autoread input{width:16px;height:16px;margin-top:2px;accent-color:var(--accent)}
.irow.justread{box-shadow:0 0 0 2px var(--ok);transition:box-shadow .3s}
.boxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.boxtile{display:flex;flex-direction:column;gap:10px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.boxtile:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.boxart{display:flex;gap:6px;height:84px;align-items:stretch;background:var(--sunken);border-radius:8px;padding:6px;overflow:hidden}
.boxart img{height:100%;aspect-ratio:63/88;object-fit:cover;border-radius:4px}
.boxempty{margin:auto;color:var(--muted);font-size:28px}
.boxinfo{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.boxinfo b{font-size:15px}
.boxhead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.boxstats{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.boxstats b{color:var(--ink);font-family:var(--f-mono)}
.boxlist,.mvlist{display:flex;flex-direction:column;gap:6px}
.mvlist{max-height:360px;overflow:auto;padding-right:4px}
.brow2,.mvrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13.5px}
.mvrow{grid-template-columns:auto 34px minmax(0,1fr) auto;cursor:pointer}
.mvrow:hover{border-color:var(--accent)}
.brow2 .thumb,.mvrow .thumb{width:34px;aspect-ratio:63/88;border-radius:3px;background:var(--sunken);overflow:hidden;display:block}
.brow2 .thumb img,.mvrow .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.bname{min-width:0}.bname b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bname small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.brow2{grid-template-columns:34px minmax(0,1fr) auto}.brow2 .chip,.brow2 .btn{grid-column:2 / -1;justify-self:start}}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.drops{grid-template-columns:1fr}}
.drop:hover{border-color:var(--muted)}
.splitbox{border:1.5px solid var(--accent);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.splittools,.splitacts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gridset{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.gridset input{width:52px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.splitstage{position:relative;width:100%;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:8px;overflow:hidden;cursor:crosshair;background:var(--sunken)}
.splitstage img{display:block;width:100%;height:auto;max-width:100%;pointer-events:none}
.sbox{position:absolute;border:2.5px solid #3BE0A0;background:rgb(59 224 160 / .14);box-shadow:0 0 0 1px rgb(0 0 0 / .45);border-radius:4px;cursor:move;transform-origin:50% 50%}
.sbox-n{position:absolute;left:-2px;top:-2px;background:#3BE0A0;color:#0B1A14;font:700 12px/1 var(--f-mono);padding:3px 6px;border-radius:3px 0 4px 0}
.sbox-x{position:absolute;right:-2px;top:-2px;width:24px;height:24px;border:0;border-radius:0 3px 0 4px;background:#0B1A14;color:#fff;font-size:15px;line-height:1;cursor:pointer}
.sbox-t{position:absolute;right:22px;top:-2px;width:24px;height:24px;border:0;border-radius:0 0 4px 4px;background:#0B1A14;color:#3BE0A0;font-size:14px;line-height:1;cursor:pointer}
.sbox-h{position:absolute;right:-7px;bottom:-7px;width:16px;height:16px;border-radius:50%;background:#3BE0A0;border:2px solid #0B1A14;cursor:nwse-resize}
.sbox-r{position:absolute;left:50%;top:-20px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;border:2px solid #0B1A14;cursor:grab}
.sbox-r::after{content:"";position:absolute;left:50%;top:12px;width:2px;height:8px;margin-left:-1px;background:#0B1A14}
.brow{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr .8fr auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:10px}
.holdlist{list-style:none;margin:0;padding:0;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.holdlist li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:3px 0}
@media (max-width:1100px){.ifields{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.ocard{grid-template-columns:minmax(0,1fr)}.ifields{grid-template-columns:repeat(2,minmax(0,1fr))}.brow{grid-template-columns:1fr 1fr}.irow{grid-template-columns:20px 56px minmax(0,1fr)}.irow>.btn.danger{grid-column:3;justify-self:start}}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p class="note" style="padding:40px 0">Loading…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="split.js"></script>
<script src="ocr.js"></script>
<script src="admin.js"></script>
</body>
</html>
